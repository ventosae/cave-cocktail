<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="description" content="Halloween at the Collingwood Cave Cocktail. 1/36 Bedford Street, Collingwood. 6pm till impossibly late.">
<meta name="theme-color" content="#0b2224">
<title>Collingwood Cave Cocktail</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Shrikhand&family=Archivo:wght@400;500;600&display=swap">

<body>
<style>
/* Layout: one 12" record floating on a dark teal ground. Side A = invite label, Side B = recipe tracklist. */
:root{
  --bg:#0b2224;
  --bg-2:#06494f;
  --vinyl:#0b0b0d;
  --vinyl-hi:#2a2a30;
  --label:#2bb9cf;
  --label-deep:#1c9db1;
  --ink:#0a0a0c;
  --ink-soft:rgba(10,10,12,.72);
  --cream:#e9e4d6;
  --logo:"Shrikhand",Georgia,serif;
  --sans:"Archivo","Helvetica Neue",Arial,sans-serif;
  color-scheme:dark;
}
[hidden]{display:none!important}
html{height:100%}
body{
  box-sizing:border-box;min-height:100%;margin:0;background:var(--bg);color:var(--cream);font-family:var(--sans);
  padding-left:max(16px,env(safe-area-inset-left,0px));
  padding-right:max(16px,env(safe-area-inset-right,0px));
  padding-block:20px;
  display:flex;flex-direction:column;align-items:center;justify-content:center;gap:26px;
  overflow-x:hidden;
  background-image:radial-gradient(ellipse 70% 55% at 50% 42%,var(--bg-2) 0%,var(--bg) 72%);
  user-select:none;-webkit-user-select:none;
}
/* explicit height as well as aspect-ratio: Safari before 15 ignores aspect-ratio */
.stage{perspective:1400px;width:min(94vw,500px);height:min(94vw,500px);aspect-ratio:1;max-width:100%;touch-action:none;cursor:grab}
.stage:active{cursor:grabbing}
.tilt{
  width:100%;height:100%;transform-style:preserve-3d;
  transform:rotateX(var(--rx,0deg)) rotateY(var(--ry,0deg));
  transition:transform .08s linear;will-change:transform;
}
.flip{
  position:relative;width:100%;height:100%;transform-style:preserve-3d;
  transform:rotateY(var(--fy,0deg));will-change:transform;
  transition:transform .9s cubic-bezier(.2,.8,.2,1);
}
/* backface-visibility on the side only. Do not add it to the children: Android Chrome then drops the B side when the spin stops. */
.side{
  position:absolute;inset:0;border-radius:50%;
  backface-visibility:hidden;-webkit-backface-visibility:hidden;
  box-shadow:0 40px 60px rgba(0,0,0,.6);will-change:transform;
}
.side.b{transform:rotateY(180deg)}
/* the spinning disc */
.disc{
  position:absolute;inset:0;border-radius:50%;
  transform:rotate(var(--spin,0deg)) translateZ(0);will-change:transform;
  background:
    repeating-radial-gradient(circle at 50% 50%,var(--vinyl) 0 1.1px,#141417 1.1px 2.2px),
    var(--vinyl);
  box-shadow:0 0 0 1px #000 inset;
}
.disc::after{ /* run-out groove + dead wax ring */
  content:"";position:absolute;inset:0;border-radius:50%;
  background:
    radial-gradient(circle closest-side,transparent 0 68.6%,#000 68.6% 70.2%,transparent 70.2%),
    radial-gradient(circle closest-side,transparent 0 94%,rgba(255,255,255,.05) 94% 94.6%,transparent 94.6%);
}
/* light on the vinyl: stays put while the disc spins */
.sheen{
  position:absolute;inset:0;border-radius:50%;pointer-events:none;mix-blend-mode:screen;
  background:
    conic-gradient(from calc(var(--light,0deg) - 90deg) at 50% 50%,
      rgba(255,255,255,0) 0deg,rgba(255,255,255,.14) 18deg,rgba(255,255,255,0) 40deg,
      rgba(255,255,255,0) 180deg,rgba(255,255,255,.12) 198deg,rgba(255,255,255,0) 220deg,rgba(255,255,255,0) 360deg);
  -webkit-mask:radial-gradient(circle closest-side,transparent 0 68%,#000 70%);
  mask:radial-gradient(circle closest-side,transparent 0 68%,#000 70%);
}
.label{
  position:absolute;left:16%;top:16%;width:68%;height:68%;border-radius:50%;
  background:radial-gradient(circle at 40% 35%,var(--label) 0%,var(--label-deep) 100%);
  box-shadow:0 0 0 1px rgba(0,0,0,.55) inset,0 0 0 1.5px rgba(0,0,0,.7);
}
.label svg{position:absolute;inset:0;width:100%;height:100%;display:block;text-rendering:geometricPrecision}
.hole{position:absolute;left:50%;top:50%;width:5%;height:5%;transform:translate(-50%,-50%);border-radius:50%;background:var(--bg);box-shadow:0 0 0 1.5px #000,0 1px 2px rgba(0,0,0,.7) inset}
/* label type (SVG). Bands: rim text r≈138, seat dots r=126, core content inside r=118 */
.rim{font:500 8.4px var(--sans);letter-spacing:.7px;fill:var(--ink-soft);text-transform:uppercase}
.logo{font:400 12.5px/1 var(--logo);fill:var(--ink)}
.title{font:700 15px var(--sans);fill:var(--ink);letter-spacing:.3px}
.big{font:700 12.5px var(--sans);fill:var(--ink)}
.body{font:500 10.5px var(--sans);fill:var(--ink)}
.small{font:600 8.4px var(--sans);fill:var(--ink-soft);letter-spacing:.9px;text-transform:uppercase}
.row{font:500 10.5px var(--sans);fill:var(--ink)}
.rowt{font:700 10.5px var(--sans);fill:var(--ink)}
.hr{stroke:var(--ink);stroke-opacity:.35;stroke-width:1}
.seat{fill:var(--ink);opacity:.22}
.seat.on{opacity:1}
/* controls */
.ctl{display:flex;gap:12px;align-items:center;justify-content:center;flex-wrap:wrap;max-width:100%}
button{
  font:500 11px/1 var(--sans);letter-spacing:.2em;text-transform:uppercase;color:var(--cream);
  background:rgba(255,255,255,.04);border:1px solid rgba(233,228,214,.35);border-radius:999px;padding:12px 18px;cursor:pointer;white-space:nowrap;
  display:inline-flex;align-items:center;gap:8px;
}
button.primary{background:var(--label);color:var(--ink);border-color:var(--label)}
button:hover{border-color:var(--cream)}
button.primary:hover{border-color:var(--cream)}
button:focus-visible{outline:2px solid var(--cream);outline-offset:3px}
.tri{width:0;height:0;border-left:8px solid currentColor;border-top:5px solid transparent;border-bottom:5px solid transparent}
.bars{width:8px;height:10px;border-left:3px solid currentColor;border-right:3px solid currentColor;box-sizing:border-box}
.hint{min-height:1.4em;font:400 10.5px/1.4 var(--sans);letter-spacing:.16em;text-transform:uppercase;color:rgba(233,228,214,.55);text-align:center}
/* RSVP panel + organiser list */
.panel{width:min(94vw,500px);max-width:100%;box-sizing:border-box;border:1px solid rgba(233,228,214,.22);border-radius:14px;padding:20px;background:rgba(0,0,0,.28);display:flex;flex-direction:column;gap:16px;user-select:text;-webkit-user-select:text}
.panel h2{margin:0;font:400 24px/1.1 var(--logo);color:var(--label)}
.panel p{margin:6px 0 0;font:400 13.5px/1.45 var(--sans);color:rgba(233,228,214,.82)}
.panel form{display:flex;flex-direction:column;gap:14px;margin:0}
.field{display:flex;flex-direction:column;gap:6px;min-width:0}
.field label,.field .lbl{font:600 9.5px/1 var(--sans);letter-spacing:.2em;text-transform:uppercase;color:rgba(233,228,214,.6)}
.field input{font:400 16px/1.3 var(--sans);color:var(--cream);background:rgba(255,255,255,.05);border:1px solid rgba(233,228,214,.3);border-radius:8px;padding:11px 12px;width:100%;min-width:0;box-sizing:border-box}
.field input::placeholder{color:rgba(233,228,214,.35)}
.field input:focus{outline:2px solid var(--label);outline-offset:1px;border-color:transparent}
.chips{display:flex;flex-wrap:wrap;gap:8px}
.chip{font:500 11px/1 var(--sans);letter-spacing:.08em;text-transform:uppercase;color:var(--cream);background:transparent;border:1px solid rgba(233,228,214,.3);border-radius:999px;padding:9px 12px;cursor:pointer}
.chip[aria-pressed="true"]{background:var(--label);color:var(--ink);border-color:var(--label)}
.actions{display:flex;gap:12px;align-items:center;flex-wrap:wrap}
.msg{font:400 13px/1.4 var(--sans);color:rgba(233,228,214,.85);min-height:1.4em}
.msg.err{color:#ffb4a8}
.note{font:400 10px/1.5 var(--sans);letter-spacing:.12em;text-transform:uppercase;color:rgba(233,228,214,.45)}
.glist{display:grid;grid-template-columns:auto 1fr;gap:8px 14px;font:400 13.5px/1.4 var(--sans);margin:0}
.glist dt{font-weight:600;margin:0}
.glist dd{margin:0;color:rgba(233,228,214,.72);min-width:0;overflow-wrap:anywhere}
button:disabled{opacity:.5;cursor:default}
@media (prefers-reduced-motion:reduce){.tilt,.flip{transition:none}}
</style>

<script>
(function(){
  // ---- seats (live from the guest list when RSVP is connected) ----
  var ACCEPTED=5,SEATS=13;
  var ring=document.getElementById('seatring');
  function drawSeats(taken,seats){
    while(ring.firstChild)ring.removeChild(ring.firstChild);
    for(var i=0;i<seats;i++){
      var a=(-90+i*(360/seats))*Math.PI/180, r=126;
      var c=document.createElementNS('http://www.w3.org/2000/svg','circle');
      c.setAttribute('cx',(Math.cos(a)*r).toFixed(2));c.setAttribute('cy',(Math.sin(a)*r).toFixed(2));c.setAttribute('r','2.4');
      c.setAttribute('class','seat'+(i<taken?' on':''));ring.appendChild(c);
    }
    var txt=Math.min(taken,seats)+' of '+seats+' seats taken'+(taken>=seats?' · full':'');
    document.getElementById('seatText').textContent=txt;
    document.getElementById('rsvpIntro').textContent=(taken>=seats
      ?'The cave is full. Put your name down and you go on the waiting list.'
      :txt+'. Your name goes on the list and the counter on the label moves.');
  }
  drawSeats(ACCEPTED,SEATS);

  // ---- audio (set TRACK to a file published next to this page, or a data: URI) ----
  var TRACK="come-together.mp3",START=0; // clip already cut from 1:22
  var audio=document.getElementById('track');
  if(TRACK)audio.src=TRACK;
  var cued=false;
  audio.addEventListener("loadedmetadata",function(){ if(!cued){ try{audio.currentTime=START;}catch(e){} cued=true; } });

  // ---- 3D tilt ----
  var stage=document.getElementById('stage'),tilt=document.getElementById('tilt'),flip=document.getElementById('flip');
  var rx=0,ry=0,dragging=false,lx=0,ly=0,gyroOn=false,t=0,flipped=false;
  var reduced=matchMedia('(prefers-reduced-motion: reduce)').matches;
  function clamp(v,m){return Math.max(-m,Math.min(m,v));}
  function applyTilt(){
    tilt.style.setProperty('--rx',rx+'deg');tilt.style.setProperty('--ry',ry+'deg');
    tilt.style.setProperty('--light',(-ry*1.5)+'deg');
  }
  stage.addEventListener('pointerdown',function(e){dragging=true;lx=e.clientX;ly=e.clientY;stage.setPointerCapture(e.pointerId);});
  stage.addEventListener('pointermove',function(e){
    if(!dragging)return;
    ry=clamp(ry+(e.clientX-lx)*0.35,40);rx=clamp(rx-(e.clientY-ly)*0.35,30);
    lx=e.clientX;ly=e.clientY;applyTilt();
  });
  function up(){dragging=false;}
  stage.addEventListener('pointerup',up);stage.addEventListener('pointercancel',up);

  // ---- turntable ----
  var discs=document.querySelectorAll('[data-disc]');
  var angle=0,speed=0,last=performance.now(),RPM=200; // 33⅓ rpm = 200 deg/s
  var stopping=false,stopFrom=0,stopTo=0,stopT=0,STOP_DUR=1.8;
  var playing=false,playBtn=document.getElementById('play'),playLabel=document.getElementById('playLabel');
  function setPlaying(p){
    playing=p;
    if(p){stopping=false;}
    else{ // finish the current revolution and come to rest at the start position
      stopping=true;stopFrom=angle;stopTo=Math.ceil((angle+60)/360)*360;stopT=0;
    }
    playBtn.setAttribute('aria-pressed',String(p));playLabel.textContent=p?'Pause':'Play';
    playBtn.firstElementChild.className=p?'bars':'tri';
    if(audio.src){ if(p){ if(!cued&&audio.readyState>0){try{audio.currentTime=START;}catch(e){} cued=true;} audio.play().catch(function(){}); } else {audio.pause();} }
  }
  playBtn.addEventListener('click',function(){setPlaying(!playing);});
  audio.addEventListener('ended',function(){setPlaying(false);});

  function easeOut(x){return 1-Math.pow(1-x,3);}
  function frame(now){
    var dt=Math.min(0.05,(now-last)/1000);last=now;
    if(playing){
      speed+=(RPM-speed)*1.6*dt;            // motor spin-up
      angle+=speed*dt;
    }else if(stopping){
      stopT+=dt;var k=Math.min(1,stopT/STOP_DUR);
      angle=stopFrom+(stopTo-stopFrom)*easeOut(k);
      speed=(stopTo-stopFrom)*(3*Math.pow(1-k,2))/STOP_DUR;
      if(k>=1){stopping=false;angle=0;speed=0;}
    }
    var shown=((angle%360)+360)%360;
    for(var i=0;i<discs.length;i++)discs[i].style.setProperty('--spin',(discs[i].dataset.disc==='b'?-shown:shown)+'deg');
    if(!dragging&&!gyroOn){
      t+=0.01;
      var tx=reduced?0:Math.sin(t)*5, ty=reduced?0:Math.cos(t*0.8)*7;
      rx+=(tx-rx)*0.04;ry+=(ty-ry)*0.04;applyTilt();
    }
    requestAnimationFrame(frame);
  }
  requestAnimationFrame(frame);

  // ---- flip ----
  document.getElementById('flipBtn').addEventListener('click',function(){
    flipped=!flipped;flip.style.setProperty('--fy',flipped?'180deg':'0deg');
  });

  // ---- gyroscope (self-hosted page only; the claude.ai viewer blocks motion) ----
  var hint=document.getElementById('hint'),gyroBtn=document.getElementById('gyro');
  function onOrient(e){
    if(e.gamma==null)return;gyroOn=true;
    var g=clamp(e.gamma,35),b=clamp(e.beta-45,35);
    ry+=(g*1.0-ry)*0.15;rx+=(-b*0.8-rx)*0.15;applyTilt();
  }
  function enableGyro(){
    try{
      if(typeof DeviceOrientationEvent!=='undefined'&&typeof DeviceOrientationEvent.requestPermission==='function'){
        DeviceOrientationEvent.requestPermission().then(function(s){
          if(s==='granted'){window.addEventListener('deviceorientation',onOrient);hint.textContent='Tilt your phone';gyroBtn.hidden=true;}
          else{hint.textContent='Tilt was not allowed · drag instead';gyroBtn.hidden=true;}
        }).catch(function(){hint.textContent='Tilt needs the site live on https · drag for now';gyroBtn.hidden=true;});
      }else{window.addEventListener('deviceorientation',onOrient);gyroBtn.hidden=true;}
    }catch(err){}
  }
  if('ontouchstart' in window&&typeof DeviceOrientationEvent!=='undefined'&&!window.isSecureContext){
    hint.textContent='Tilt needs the site live on https · drag for now';
  }else if('ontouchstart' in window&&typeof DeviceOrientationEvent!=='undefined'){
    if(typeof DeviceOrientationEvent.requestPermission==='function'){gyroBtn.hidden=false;gyroBtn.addEventListener('click',enableGyro);hint.textContent='Drag to tilt, or tap Use tilt';}
    else{enableGyro();}
    window.addEventListener('deviceorientation',function(e){if(e.gamma!=null)hint.textContent='Tilt your phone, or drag';},{once:true});
  }

  // ---- RSVP ----
  // Supabase project URL + anon (public) key. Leave empty for preview mode: entries stay on this phone only.
  var RSVP={url:"https://jainfeowohzqbamlsfvv.supabase.co",key:"eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImphaW5mZW93b2h6cWJhbWxzZnZ2Iiwicm9sZSI6ImFub24iLCJpYXQiOjE3OTI1NzczOTMsImV4cCI6MjEwODE1MzM5M30.lxrAUoYkoPIEBmuW-8FJkBI9yRRXwvyhwoNEZkQu3tA"};
  var LS_KEY='cave_rsvp_v1';
  function lsGet(k){try{return JSON.parse(localStorage.getItem(k));}catch(e){return null;}}
  function lsSet(k,v){try{localStorage.setItem(k,JSON.stringify(v));}catch(e){}}
  function api(path,body,prefer){
    return fetch(RSVP.url+'/rest/v1/'+path,{method:'POST',headers:{
      'apikey':RSVP.key,'Authorization':'Bearer '+RSVP.key,'Content-Type':'application/json','Prefer':prefer||'return=minimal'},
      body:JSON.stringify(body)}).then(function(r){
        return r.text().then(function(t){
          if(!r.ok){var m=t;try{m=JSON.parse(t).message||t;}catch(e){} throw new Error('HTTP '+r.status+' '+m);}
          return t?JSON.parse(t):null;   // a successful insert comes back with an empty body
        });
      });
  }
  var connected=!!(RSVP.url&&RSVP.key);
  var rsvpPanel=document.getElementById('rsvp'),rsvpBtn=document.getElementById('rsvpBtn');
  var rsvpForm=document.getElementById('rsvpForm'),rsvpMsg=document.getElementById('rsvpMsg'),rsvpNote=document.getElementById('rsvpNote');
  var guestsPanel=document.getElementById('guests');
  rsvpNote.textContent=connected?'Your name and food notes go only to the host.':'Preview · guest list not connected yet · saved on this device only';

  function loadCount(){
    if(!connected){
      var local=lsGet(LS_KEY)||[];drawSeats(ACCEPTED+local.length,SEATS);return;
    }
    api('rpc/seat_count',{},'return=representation').then(function(d){
      if(d&&typeof d.taken==='number')drawSeats(d.taken,d.seats||SEATS);
    }).catch(function(){});
  }
  loadCount();

  function showPanel(which){
    rsvpPanel.hidden=which!=='rsvp';guestsPanel.hidden=which!=='guests';
    rsvpBtn.setAttribute('aria-expanded',String(which==='rsvp'));
    if(which)document.getElementById(which).scrollIntoView({behavior:reduced?'auto':'smooth',block:'start'});
  }
  rsvpBtn.addEventListener('click',function(){showPanel(rsvpPanel.hidden?'rsvp':null);});
  if(location.hash==='#rsvp')showPanel('rsvp');
  if(location.hash==='#guests')showPanel('guests');

  var chips=document.querySelectorAll('#chips .chip');
  for(var ci=0;ci<chips.length;ci++)chips[ci].addEventListener('click',function(){
    this.setAttribute('aria-pressed',this.getAttribute('aria-pressed')==='true'?'false':'true');
  });

  var already=lsGet(LS_KEY+'_me');
  function markDone(name){
    rsvpMsg.className='msg';rsvpMsg.textContent='You are on the list, '+name+'. See you in the cave.';
    document.getElementById('fSubmit').disabled=true;document.getElementById('fName').value=name;
  }
  if(already&&already.name)markDone(already.name);

  rsvpForm.addEventListener('submit',function(e){
    e.preventDefault();
    var name=document.getElementById('fName').value.trim();
    if(!name){rsvpMsg.className='msg err';rsvpMsg.textContent='Your name, please.';document.getElementById('fName').focus();return;}
    var picked=[];for(var i=0;i<chips.length;i++)if(chips[i].getAttribute('aria-pressed')==='true')picked.push(chips[i].textContent);
    var extra=document.getElementById('fDiet').value.trim();
    var dietary=picked.concat(extra?[extra]:[]).join(' · ').slice(0,300);
    var track=document.getElementById('fTrack').value.trim().slice(0,120);
    var entry={name:name,dietary:dietary||null,track:track||null};
    var btn=document.getElementById('fSubmit');btn.disabled=true;rsvpMsg.className='msg';rsvpMsg.textContent='Adding you…';
    var done=function(){lsSet(LS_KEY+'_me',{name:name});markDone(name);loadCount();};
    if(!connected){var local=lsGet(LS_KEY)||[];local.push(entry);lsSet(LS_KEY,local);done();return;}
    api('rsvps',entry).then(done).catch(function(err){
      btn.disabled=false;rsvpMsg.className='msg err';rsvpMsg.textContent='That did not go through ('+String(err.message||err).slice(0,120)+'). Try again, or message the host.';
    });
  });

  // ---- organiser view: open the page with #guests ----
  document.getElementById('guestForm').addEventListener('submit',function(e){
    e.preventDefault();
    var pass=document.getElementById('gPass').value,gm=document.getElementById('guestMsg'),gl=document.getElementById('glist');
    function render(rows){
      while(gl.firstChild)gl.removeChild(gl.firstChild);
      if(!rows.length){gm.textContent='No RSVPs yet.';return;}
      gm.textContent=rows.length+' on the list';
      rows.forEach(function(r){
        var dt=document.createElement('dt'),dd=document.createElement('dd');
        dt.textContent=r.name+(r.status==='waitlist'?' (waitlist)':'');
        dd.textContent=[r.dietary||'no dietary notes',r.track?'brings: '+r.track:''].filter(Boolean).join(' · ');
        gl.appendChild(dt);gl.appendChild(dd);
      });
    }
    if(!connected){render(lsGet(LS_KEY)||[]);gm.textContent+=' · preview, this device only';return;}
    gm.className='msg';gm.textContent='Loading…';
    api('rpc/guest_list',{pass:pass},'return=representation').then(function(rows){
      if(!rows||!rows.length){gm.className='msg err';gm.textContent='Nothing came back. Wrong passphrase, or no RSVPs yet.';return;}
      gm.className='msg';render(rows);
    }).catch(function(err){gm.className='msg err';gm.textContent='Could not load the list ('+String(err.message||err).slice(0,120)+').';});
  });

  applyTilt();
})();
</script>

</body>
</html>
